name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v0.2.3'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check tag matches application version
        shell: pwsh
        run: |
          python -c "import os; from app.workflows import VERSION; assert os.environ['RELEASE_TAG']=='v'+VERSION, 'Tag/version mismatch'"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_frontend.cjs
      - run: node tests/test_appearance.cjs
      - run: node tests/test_updates.cjs
      - run: node tests/test_management.cjs
      - run: node tests/test_research.cjs
      - run: node tests/test_assistant.cjs
      - run: node tests/test_assistant_navigation.cjs
      - run: node tests/test_assistant_proposals.cjs
      - run: node tests/test_followup.cjs
      - run: node tests/test_plotting.cjs
      - run: node tests/test_analysis.cjs
      - run: node tests/test_paper.cjs
      - run: python tools/build_windows.py
      - name: Verify packaged statistical workers and exports
        run: python tools/verify_windows_analysis.py
      - run: python tools/package_source.py
      - run: python tools/prepare_release.py $env:RELEASE_TAG
      - name: Publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:RELEASE_TAG
          gh release view $tag --json isDraft | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; never replace published assets. Delete an incomplete draft explicitly before retrying.' }
          gh release create $tag --verify-tag --draft --title "研序 Research Studio $tag" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release' }
          gh release upload $tag "dist/YanxuResearchStudio-Windows-$tag.zip" "dist/YanxuResearchStudio-Source-$tag.zip" dist/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed; release remains a draft' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release' }
